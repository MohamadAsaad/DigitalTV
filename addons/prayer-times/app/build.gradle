plugins {
    id 'com.android.application'
}

android {
    namespace 'com.majnioui.tv.prayer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.majnioui.tv.prayer'
        minSdk 26
        targetSdk 34
        versionCode providers.gradleProperty('releaseVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('releaseVersionName').getOrElse('1.0')
    }

    if (providers.gradleProperty('releaseStoreFile').isPresent()) {
        signingConfigs {
            releaseKey {
                storeFile file(providers.gradleProperty('releaseStoreFile').get())
                storePassword providers.gradleProperty('releaseStorePassword').get()
                keyAlias providers.gradleProperty('releaseKeyAlias').get()
                keyPassword providers.gradleProperty('releaseKeyPassword').get()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Local builds use the development key; tagged releases can use the shared private key.
            signingConfig providers.gradleProperty('releaseStoreFile').isPresent()
                    ? signingConfigs.releaseKey : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
