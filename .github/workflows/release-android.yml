name: Build Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Require the stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Set RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD in repository Actions secrets." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ORG_GRADLE_PROJECT_releaseStoreFile=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseStorePassword=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseKeyAlias=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseKeyPassword=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          VERSION_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((9 + RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          (cd launcher && ./gradlew --no-daemon assembleRelease -PreleaseVersionName="$VERSION_NAME" -PreleaseVersionCode="$VERSION_CODE")
          (cd updater && ./gradlew --no-daemon assembleRelease -PreleaseVersionName="$VERSION_NAME" -PreleaseVersionCode="$VERSION_CODE")

      - name: Prepare release files and updater manifest
        env:
          VERSION_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((9 + RUN_NUMBER))
          mkdir -p dist
          cp launcher/app/build/outputs/apk/release/app-release.apk dist/digitaltv-launcher.apk
          cp updater/app/build/outputs/apk/release/app-release.apk dist/digitaltv-updater.apk
          python3 tools/make_update_manifest.py dist/digitaltv-launcher.apk --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" --output dist/update-manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/digitaltv-launcher.apk dist/digitaltv-updater.apk dist/update-manifest.json
