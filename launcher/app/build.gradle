plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode providers.gradleProperty('releaseVersionCode').getOrElse('9').toInteger()
        versionName providers.gradleProperty('releaseVersionName').getOrElse('3.0')
    }

    if (providers.gradleProperty('releaseStoreFile').isPresent()) {
        signingConfigs {
            releaseKey {
                storeFile file(providers.gradleProperty('releaseStoreFile').get())
                storePassword providers.gradleProperty('releaseStorePassword').get()
                keyAlias providers.gradleProperty('releaseKeyAlias').get()
                keyPassword providers.gradleProperty('releaseKeyPassword').get()
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Local builds keep the development key; tagged public releases may supply a private stable key.
            signingConfig providers.gradleProperty('releaseStoreFile').isPresent()
                    ? signingConfigs.releaseKey : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
